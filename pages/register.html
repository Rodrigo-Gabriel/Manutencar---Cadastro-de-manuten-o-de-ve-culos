<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="../login.css"/>
    <link rel="shortcut icon" href="../assets/img/loginAlt.png" type="image/x-icon"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"/>

    <title>Login</title>
</head>

<body>
    <header></header>
    <main>
        <section class="section-form">
            <h1 class="title">Register</h1>
            <form class="form-login" action="">
                <input type="text" id="nome" placeholder="Nome" maxlength="100" required />

                <input type="email" id="email" placeholder="Email" maxlength="80" required />

                <div class="senha">
                    <input type="password" id="senha" placeholder="Senha" minlength="10" maxlength="10" required />
                    <i class="bi bi-eye-fill" id="btn-senha" onclick="mostrarSenha()"></i>
                </div>

                <div class="senha">
                    <input type="password" id="confirmPass" placeholder="Confirmar senha" minlength="10" maxlength="10"
                        required />
                    <i class="bi bi-eye-fill" id="btn-confirm-senha" onclick="mostrarConfirmSenha()"></i>
                </div>

                <button class="btn-signIn" id="btn-signin" onclick="enviar(event)">
                    Create
                </button>
                <a href="../index.html">Já tem uma conta? <b>Entre nela!</b></a>
            </form>
        </section>
    </main>
    <footer></footer>

    <script src="../script/register.js" defer></script>
</body>
</html>
